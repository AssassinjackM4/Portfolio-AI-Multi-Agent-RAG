services:
  - type: web
    name: portfolio-ai-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://portfolio-ai-multi-agent-rag.vercel.app
      - key: PYTHON_VERSION
        value: 3.12.0
